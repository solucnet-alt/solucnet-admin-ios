<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0084ff">
    <title>SolucNet Admin — Iniciar sesión</title>
    <!-- 🆕 v2026-06-01: PWA iOS/iPad -->
    <link rel="manifest" href="/mobile-admin/manifest.json">
    <link rel="apple-touch-icon" href="/mobile-admin/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile-admin/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SolucNet Admin">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 45%, #4f46e5 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -40%;
            width: 180%; height: 180%;
            background:
                radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 70% 70%, rgba(56, 189, 248, 0.20) 0%, transparent 45%);
            animation: floatBg 22s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, -30px); }
        }
        body {
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            animation: cardEnter 0.5s ease-out;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header .logo-circle {
            width: 86px; height: 86px;
            background: linear-gradient(135deg, #0084ff 0%, #6366f1 100%);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            box-shadow: 0 14px 32px rgba(99, 102, 241, 0.45);
            position: relative;
        }
        .login-header .logo-circle::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            background: linear-gradient(135deg, #0084ff, #6366f1, #ec4899);
            z-index: -1;
            opacity: 0.45;
            filter: blur(14px);
        }
        .login-header .logo-circle i { font-size: 38px; color: white; }
        .login-header h1 {
            font-size: 1.55em;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3a8a, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.4px;
        }
        .login-header .sub {
            font-size: 0.9em;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.8em;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper > i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1em;
            transition: color 0.2s;
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            padding: 15px 14px 15px 44px;
            font-size: 1em;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            color: #0f172a;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        .form-group input:focus + .show-pass-btn,
        .form-group .input-wrapper:focus-within > i {
            color: #6366f1;
        }
        .show-pass-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px 8px;
            font-size: 1em;
            transition: color 0.2s;
        }
        .show-pass-btn:active { color: #6366f1; }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0084ff 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.35);
            letter-spacing: 0.3px;
        }
        .login-btn:hover { filter: brightness(1.05); }
        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .login-btn:disabled {
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            box-shadow: none;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.88em;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
        }
        .alert.error {
            background: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .alert.success {
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .alert.show { display: block; animation: slideDown 0.25s ease-out; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            text-align: center;
            font-size: 0.78em;
            color: #94a3b8;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            font-weight: 500;
        }
        .footer-text strong {
            color: #6366f1;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-circle"><i class="fas fa-cog"></i></div>
            <h1>SolucNet Admin</h1>
            <div class="sub">Panel de gestión</div>
        </div>

        <div class="alert" id="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Usuario</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Usuario" autocapitalize="off" autocomplete="username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
                    <button type="button" class="show-pass-btn" id="show-pass-btn"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="login-btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>

        <div class="footer-text">
            <strong>SolucNet</strong> · v<span id="version-text">1.0.0</span>
        </div>
    </div>

    <!-- 🛡️ v1.0.95: cache-buster bumpado a 1.0.95 para que el WebView no sirva versión vieja cacheada -->
    <script src="config.js?v=1.0.98"></script>
    <script>
        // 🛡️ v1.0.102b (2026-06-06): si YA hay token guardado, saltar el login y abrir el dashboard.
        // ANTES: la app arrancaba siempre en login.html (porque es la URL de server.url en capacitor.config).
        // login.html NO verificaba storage existente → el usuario veía la pantalla de login cada apertura
        // aunque tuviera token válido en localStorage Y en Preferences. Por eso parecía que "el login no se
        // guardaba" — el storage estaba intacto, pero login.html no lo usaba para auto-navegar.
        // FIX: si localStorage tiene token, redirigir INMEDIATAMENTE a app.html. La validación del token
        // contra el server la hace app.html (que ya tenía esa lógica completa).
        (() => {
            try {
                const tk = localStorage.getItem('solucnet_admin_token') || localStorage.getItem('token');
                if (tk && tk.length > 50) {
                    // Reporte breve para tracking — la app no se queda en login, va al dashboard
                    try {
                        fetch('https://cliente.solucnet.com/api/admin-app-error', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: '[LOGIN-SKIP] token encontrado, redirigiendo a app.html',
                                route: 'login.html', userAgent: navigator.userAgent
                            }), keepalive: true
                        }).catch(() => {});
                    } catch {}
                    window.location.replace('app.html');
                    return; // detener el resto del script — ya estamos navegando
                }
            } catch (e) {
                // Si localStorage falla por alguna razón rara, simplemente seguimos con el login normal
            }
        })();

        // 🔍 [DIAG TEMPORAL 2026-06-06] Reportar exactamente qué pasó cuando la app cayó al login.
        // Esto me dice si vino con localStorage vacío (storage perdido) o si tenía token pero falló validación.
        (() => {
            const _diag = (etiqueta, valor) => {
                try {
                    fetch('https://cliente.solucnet.com/api/admin-app-error', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `[LOGIN-DIAG] ${etiqueta}=${valor}`,
                            route: 'login.html',
                            userAgent: navigator.userAgent
                        }),
                        keepalive: true
                    }).catch(() => {});
                } catch {}
            };
            const lsToken = localStorage.getItem('solucnet_admin_token') || localStorage.getItem('token');
            const lsUser = localStorage.getItem('solucnet_admin_user') || localStorage.getItem('user');
            _diag('localStorage_token', lsToken ? `${lsToken.length}chars` : 'NULL');
            _diag('localStorage_user', lsUser ? 'present' : 'NULL');
            // Capacitor Preferences (asíncrono)
            (async () => {
                try {
                    if (window.Capacitor?.Plugins?.Preferences) {
                        const tk = await window.Capacitor.Plugins.Preferences.get({ key: 'solucnet_admin_token' });
                        _diag('preferences_token', tk?.value ? `${tk.value.length}chars` : 'NULL');
                    } else {
                        _diag('preferences_token', 'plugin-unavailable');
                    }
                } catch (e) { _diag('preferences_token', 'error-' + e.message); }
            })();
            // App.getInfo para confirmar la versión REAL instalada
            (async () => {
                try {
                    if (window.Capacitor?.Plugins?.App) {
                        const info = await window.Capacitor.Plugins.App.getInfo();
                        _diag('app_version_installed', info?.version || 'no-info');
                    }
                } catch (e) { _diag('app_version_installed', 'error'); }
            })();
        })();

        // 🆕 Status bar fix
        (async () => {
            try {
                if (window.Capacitor?.Plugins?.StatusBar) {
                    const { StatusBar } = window.Capacitor.Plugins;
                    await StatusBar.setOverlaysWebView({ overlay: false });
                    await StatusBar.setBackgroundColor({ color: '#0066cc' });
                    await StatusBar.setStyle({ style: 'DARK' });
                }
            } catch (e) {}
        })();
        // 🔧 v1.0.77: Mostrar versión REAL del APK (no la del config.js que puede estar desactualizada)
        (async () => {
            let ver = APP_CONFIG.APP_VERSION;
            try {
                if (window.Capacitor?.Plugins?.App) {
                    const info = await window.Capacitor.Plugins.App.getInfo();
                    if (info?.version) ver = info.version;
                }
            } catch {}
            document.getElementById('version-text').textContent = ver;
        })();

        const alertEl = document.getElementById('alert');
        const btn = document.getElementById('login-btn');
        const showAlert = (msg, type='error') => {
            alertEl.className = 'alert show ' + type;
            alertEl.textContent = msg;
            setTimeout(() => { alertEl.classList.remove('show'); }, 6000);
        };

        // Toggle show/hide password
        document.getElementById('show-pass-btn').addEventListener('click', () => {
            const p = document.getElementById('password');
            const i = document.querySelector('#show-pass-btn i');
            if (p.type === 'password') { p.type = 'text'; i.className = 'fas fa-eye-slash'; }
            else { p.type = 'password'; i.className = 'fas fa-eye'; }
        });

        function guardarSesion(token, user) {
            // 🔧 v1.0.73: SÍNCRONO — localStorage es suficiente para que app.html arranque.
            // Preferences se guarda en BACKGROUND (fire-and-forget) sin bloquear la navegación.
            // Esto resuelve el bug de Android 16 donde Preferences.set cuelga indefinidamente.
            try {
                localStorage.setItem(APP_CONFIG.STORAGE.TOKEN, token);
                localStorage.setItem(APP_CONFIG.STORAGE.USER, JSON.stringify(user));
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));
            } catch (e) { console.error('Error guardando en localStorage:', e); }

            // Preferences en background, no esperamos el resultado
            if (window.Capacitor?.Plugins?.Preferences) {
                try {
                    const { Preferences } = window.Capacitor.Plugins;
                    Preferences.set({ key: APP_CONFIG.STORAGE.TOKEN, value: token })
                        .catch(e => console.warn('Pref set token (BG):', e.message));
                    Preferences.set({ key: APP_CONFIG.STORAGE.USER, value: JSON.stringify(user) })
                        .catch(e => console.warn('Pref set user (BG):', e.message));
                } catch (e) { console.warn('Preferences setup falló:', e.message); }
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                showAlert('Completa usuario y contraseña');
                return;
            }
            btn.disabled = true;
            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando…';
            try {
                const url = APP_CONFIG.SERVER_URL + APP_CONFIG.LOGIN_ENDPOINT;
                console.log('[LOGIN] POST →', url);
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                console.log('[LOGIN] HTTP', resp.status, 'content-type:', resp.headers.get('content-type'));
                const text = await resp.text();
                console.log('[LOGIN] Body (primeros 200 chars):', text.substring(0, 200));
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseErr) {
                    // Servidor devolvió HTML/texto en vez de JSON
                    console.error('[LOGIN] No es JSON:', text.substring(0, 300));
                    showAlert(`El servidor devolvió una respuesta inválida (HTTP ${resp.status}). Verifica conexión.`);
                    btn.disabled = false;
                    btn.innerHTML = originalBtn;
                    return;
                }
                if (resp.ok && data.token) {
                    // 🆕 Bloquear acceso a técnicos: esta app es solo para admin/soporte
                    const rolUsuario = (data.user?.rol || '').toLowerCase();
                    if (rolUsuario === 'tecnico') {
                        showAlert('Esta app es solo para administradores. Los técnicos deben usar la app SolucNet Técnicos.');
                        btn.disabled = false;
                        btn.innerHTML = originalBtn;
                        return;
                    }
                    showAlert('Bienvenido ' + (data.user?.nombre || username), 'success');
                    guardarSesion(data.token, data.user || { username });

                    // 🟢 v1.0.78: Pixel ping via <img> — funciona donde fetch/XHR fallan en WebView
                    try {
                        const pingImg = new Image();
                        pingImg.src = APP_CONFIG.SERVER_URL + '/api/admin-ping?step=login-ok-pre-nav&x=' + Date.now();
                    } catch {}

                    // Navegación INMEDIATA por múltiples métodos para asegurar que funcione
                    try {
                        window.location.assign('app.html');
                    } catch (e1) {
                        try { window.location.href = 'app.html'; }
                        catch (e2) {
                            try { window.location.replace('app.html'); } catch {}
                        }
                    }
                } else {
                    showAlert(data.error || data.message || 'Credenciales inválidas');
                    btn.disabled = false;
                    btn.innerHTML = originalBtn;
                }
            } catch (err) {
                console.error('[LOGIN] Error fetch:', err);
                showAlert('Error de conexión: ' + (err.message || 'desconocido'));
                btn.disabled = false;
                btn.innerHTML = originalBtn;
            }
        });
    </script>
</body>
</html>
