# Prueba de diagnóstico: ¿qué Mac de GitHub asigna máquina a este repositorio? (se borra cuando compile)
name: Prueba runners
on: workflow_dispatch
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps: [ { run: 'sw_vers && uname -m && xcodebuild -version' } ]
